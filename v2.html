<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Reliable Answers</title>
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #0d0d0d;
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #0d0d0d;
            border-bottom: 1px solid #1f1f1f;
            z-index: 10;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .header-icons {
            display: flex;
            gap: 15px;
            color: #aaa;
            font-size: 20px;
        }

        .header-icons span {
            cursor: pointer;
            transition: color 0.2s;
        }

        .header-icons span:hover {
            color: #fff;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        .message-wrapper.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-wrapper.ai {
            align-self: flex-start;
            align-items: flex-start;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .user .message {
            background-color: #2563eb;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .ai .message {
            background-color: #1e1e1e;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
            border: 1px solid #2a2a2a;
        }

        /* Markdown Styles inside AI message */
        .ai .message p { margin-bottom: 8px; }
        .ai .message p:last-child { margin-bottom: 0; }
        .ai .message ul, .ai .message ol { margin-left: 20px; margin-bottom: 8px; }
        .ai .message li { margin-bottom: 4px; }
        .ai .message code {
            background: #2a2a2a;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            color: #f472b6;
        }
        .ai .message pre {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            border: 1px solid #333;
        }
        .ai .message pre code {
            background: transparent;
            padding: 0;
            color: #e0e0e0;
        }
        .ai .message strong { color: #fff; }
        .ai .message a { color: #60a5fa; }

        /* Message Actions */
        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message-wrapper:hover .message-actions {
            opacity: 1;
        }

        .action-icon {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #aaa;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-icon:hover {
            background: #333;
            color: #fff;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background-color: #1e1e1e;
            padding: 14px 18px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            gap: 5px;
            align-items: center;
            border: 1px solid #2a2a2a;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: #888;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Area */
        .input-area {
            padding: 15px 20px 25px 20px;
            background-color: #0d0d0d;
            border-top: 1px solid #1f1f1f;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            background-color: #1a1a1a;
            border-radius: 25px;
            padding: 8px 12px 8px 18px;
            border: 1px solid #333;
            transition: border 0.3s;
            gap: 10px;
        }

        .input-wrapper:focus-within {
            border-color: #2563eb;
        }

        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
            padding: 8px 0;
            resize: none;
            max-height: 120px;
            font-family: inherit;
            line-height: 1.5;
        }

        .input-wrapper textarea::placeholder {
            color: #888;
        }

        .input-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            padding-bottom: 4px;
        }

        .action-btn {
            background: #2a2a2a;
            border: none;
            color: #aaa;
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .action-btn:hover {
            background: #333;
            color: #fff;
        }

        .action-btn.active {
            background: #2563eb;
            color: #fff;
        }

        .send-btn {
            background: #2563eb;
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: #1d4ed8;
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: #333;
            cursor: not-allowed;
            transform: none;
        }

        /* Mic Button */
        .mic-btn {
            background: #2a2a2a;
            border: none;
            color: #aaa;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .mic-btn.recording {
            background: #dc2626;
            color: #fff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        /* Scrollbar */
        .chat-area::-webkit-scrollbar {
            width: 6px;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #2563eb;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">Fast reliable answers</div>
            <div class="header-icons">
                <span id="clearChatBtn" title="Clear Chat">🗑️</span>
                <span title="New Chat">➕</span>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chatArea"></div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <span></span><span></span><span></span>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="Yenikk oru cheriya..." rows="1"></textarea>
                <div class="input-actions">
                    <button class="action-btn" id="thinkBtn">🧠 Think</button>
                    <button class="action-btn" id="searchBtn">🌐 Search</button>
                </div>
                <button class="mic-btn" id="micBtn" title="Voice Input">🎤</button>
                <button class="send-btn" id="sendBtn" disabled>➤</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const thinkBtn = document.getElementById('thinkBtn');
        const searchBtn = document.getElementById('searchBtn');
        const micBtn = document.getElementById('micBtn');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const toast = document.getElementById('toast');

        let isThinking = false;
        let isSearching = false;
        let isRecording = false;

        // ============ LOCAL STORAGE ============
        const STORAGE_KEY = 'ai_chat_history';

        function loadHistory() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const messages = JSON.parse(saved);
                messages.forEach(msg => renderMessage(msg.text, msg.sender, false));
            } else {
                addMessage("നമസ്കാരം! 👋 ഞാൻ നിങ്ങളുടെ AI അസിസ്റ്റന്റ് ആണ്. എന്തെങ്കിലും ചോദിക്കൂ...", 'ai');
            }
        }

        function saveMessage(text, sender) {
            const saved = localStorage.getItem(STORAGE_KEY);
            const messages = saved ? JSON.parse(saved) : [];
            messages.push({ text, sender, time: Date.now() });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
        }

        function clearHistory() {
            localStorage.removeItem(STORAGE_KEY);
            chatArea.innerHTML = '';
            addMessage("ചാറ്റ് മായ്ച്ചു! 🗑️ പുതിയതായി തുടങ്ങാം.", 'ai');
            showToast("Chat cleared!");
        }

        // ============ UI TOGGLES ============
        thinkBtn.addEventListener('click', () => {
            isThinking = !isThinking;
            thinkBtn.classList.toggle('active', isThinking);
        });

        searchBtn.addEventListener('click', () => {
            isSearching = !isSearching;
            searchBtn.classList.toggle('active', isSearching);
        });

        clearChatBtn.addEventListener('click', clearHistory);

        // ============ TEXTAREA AUTO-RESIZE ============
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
            sendBtn.disabled = userInput.value.trim() === '';
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !sendBtn.disabled) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        // ============ VOICE INPUT ============
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'ml-IN'; // Malayalam
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                if (isRecording) {
                    recognition.stop();
                    return;
                }
                recognition.start();
            });

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.textContent = '⏹️';
                showToast("🎤 സംസാരിക്കൂ...");
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                userInput.dispatchEvent(new Event('input'));
            };

            recognition.onerror = () => {
                showToast("Voice input failed ❌");
            };

            recognition.onend = () => {
                isRecording = false;
                micBtn.classList.remove('recording');
                micBtn.textContent = '🎤';
            };
        } else {
            micBtn.addEventListener('click', () => {
                showToast("Voice not supported in this browser");
            });
        }

        // ============ MESSAGE FUNCTIONS ============
        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            typingIndicator.style.display = 'flex';
            chatArea.appendChild(typingIndicator);
            scrollToBottom();

            setTimeout(() => {
                typingIndicator.style.display = 'none';
                
                let response = "നിങ്ങളുടെ ചോദ്യം: \"" + text + "\"";
                
                if (isThinking) {
                    response = "🧠 **Thinking Mode:** ഞാൻ ആഴത്തിൽ ചിന്തിച്ചു...\n\n" + response;
                }
                if (isSearching) {
                    response = "🌐 **Search Mode:** ഞാൻ വെബിൽ തിരഞ്ഞു...\n\n" + response;
                }
                if (!isThinking && !isSearching) {
                    response = "ഇത് ഒരു **demo UI** ആണ്. യഥാർത്ഥ AI ബന്ധിപ്പിക്കാൻ API ആവശ്യമാണ്. 📝\n\nഉദാഹരണം:\n```javascript\nfetch('/api/chat')\n```";
                }

                addMessage(response, 'ai');
            }, 1500);
        }

        function addMessage(text, sender) {
            renderMessage(text, sender, true);
            saveMessage(text, sender);
        }

        function renderMessage(text, sender, animate = true) {
            const wrapper = document.createElement('div');
            wrapper.classList.add('message-wrapper', sender);

            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');

            if (sender === 'ai') {
                // Render Markdown for AI messages
                messageDiv.innerHTML = marked.parse(text);
            } else {
                messageDiv.textContent = text;
            }

            wrapper.appendChild(messageDiv);

            // Action buttons
            const actions = document.createElement('div');
            actions.classList.add('message-actions');

            const copyBtn = document.createElement('button');
            copyBtn.classList.add('action-icon');
            copyBtn.textContent = '📋 Copy';
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(text);
                showToast("Copied! ✅");
            };
            actions.appendChild(copyBtn);

            if (sender === 'ai') {
                const speakBtn = document.createElement('button');
                speakBtn.classList.add('action-icon');
                speakBtn.textContent = '🔊 Speak';
                speakBtn.onclick = () => speakText(text);
                actions.appendChild(speakBtn);
            }

            wrapper.appendChild(actions);
            chatArea.appendChild(wrapper);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // ============ TEXT TO SPEECH ============
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const cleanText = text.replace(/[#*`_]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'ml-IN';
                utterance.rate = 1;
                window.speechSynthesis.speak(utterance);
            } else {
                showToast("Speech not supported");
            }
        }

        // ============ TOAST ============
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ============ INIT ============
        loadHistory();
    </script>
</body>
</html>
