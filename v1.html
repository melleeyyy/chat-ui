<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Reliable Answers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #0d0d0d;
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #0d0d0d;
            border-bottom: 1px solid #1f1f1f;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .header-icons {
            display: flex;
            gap: 15px;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
        }

        .header-icons span:hover {
            color: #fff;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background-color: #2563eb;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: #1e1e1e;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background-color: #1e1e1e;
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            gap: 5px;
            align-items: center;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: #888;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Area */
        .input-area {
            padding: 15px 20px 25px 20px;
            background-color: #0d0d0d;
            border-top: 1px solid #1f1f1f;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: #1a1a1a;
            border-radius: 25px;
            padding: 10px 15px;
            border: 1px solid #333;
            transition: border 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: #2563eb;
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
            padding: 5px;
        }

        .input-wrapper input::placeholder {
            color: #888;
        }

        .input-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .action-btn {
            background: #2a2a2a;
            border: none;
            color: #aaa;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #333;
            color: #fff;
        }

        .action-btn.active {
            background: #2563eb;
            color: #fff;
        }

        .send-btn {
            background: #2563eb;
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            transition: background 0.2s;
            margin-left: 10px;
        }

        .send-btn:hover {
            background: #1d4ed8;
        }

        .send-btn:disabled {
            background: #333;
            cursor: not-allowed;
        }

        /* Scrollbar */
        .chat-area::-webkit-scrollbar {
            width: 6px;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">Fast reliable answers</div>
            <div class="header-icons">
                <span>🔔</span>
                <span>➕</span>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chatArea">
            <!-- Messages will be added here dynamically -->
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <span></span><span></span><span></span>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Yenikk oru cheriya..." autocomplete="off">
                <div class="input-actions">
                    <button class="action-btn" id="thinkBtn">🧠 Think</button>
                    <button class="action-btn" id="searchBtn">🌐 Search</button>
                </div>
            </div>
            <button class="send-btn" id="sendBtn" disabled>➤</button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const thinkBtn = document.getElementById('thinkBtn');
        const searchBtn = document.getElementById('searchBtn');

        let isThinking = false;
        let isSearching = false;

        // Toggle Think Mode
        thinkBtn.addEventListener('click', () => {
            isThinking = !isThinking;
            thinkBtn.classList.toggle('active', isThinking);
        });

        // Toggle Search Mode
        searchBtn.addEventListener('click', () => {
            isSearching = !isSearching;
            searchBtn.classList.toggle('active', isSearching);
        });

        // Enable/Disable Send Button
        userInput.addEventListener('input', () => {
            sendBtn.disabled = userInput.value.trim() === '';
        });

        // Send on Enter key
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) {
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Add User Message
            addMessage(text, 'user');
            userInput.value = '';
            sendBtn.disabled = true;

            // Show Typing Indicator
            typingIndicator.style.display = 'flex';
            chatArea.appendChild(typingIndicator); // Move to bottom
            scrollToBottom();

            // Simulate AI Response after delay
            setTimeout(() => {
                typingIndicator.style.display = 'none';
                
                // Generate Mock Response based on mode
                let response = "ഞാൻ ഒരു AI ആണ്. നിങ്ങളുടെ ചോദ്യം: \"" + text + "\"";
                
                if (isThinking) {
                    response = "🧠 **Thinking Mode:** ഞാൻ ആഴത്തിൽ ചിന്തിച്ചു... " + response;
                }
                if (isSearching) {
                    response = "🌐 **Search Mode:** ഞാൻ വെബിൽ തിരഞ്ഞു... " + response;
                }
                if (!isThinking && !isSearching) {
                    response = "നിങ്ങളുടെ ചോദ്യത്തിന് ഉത്തരം: ഇത് ഒരു demo UI ആണ്. യഥാർത്ഥ AI ബന്ധിപ്പിക്കാൻ API ആവശ്യമാണ്. 📝";
                }

                addMessage(response, 'ai');
            }, 1500); // 1.5 seconds delay
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            messageDiv.classList.add(sender === 'user' ? 'user-message' : 'ai-message');
            
            // Simple formatting for bold (**text**)
            let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            messageDiv.innerHTML = formattedText;
            
            chatArea.appendChild(messageDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Initial Welcome Message
        setTimeout(() => {
            addMessage("നമസ്കാരം! 👋 ഞാൻ നിങ്ങളുടെ AI അസിസ്റ്റന്റ് ആണ്. എന്തെങ്കിലും ചോദിക്കൂ...", 'ai');
        }, 500);
    </script>
</body>
</html>
