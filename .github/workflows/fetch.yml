name: Fetch shared code
on:
  push:
    paths:
      - '.github/workflows/fetch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch shared conversation
        run: |
          python3 - << 'EOF'
          import json, urllib.request
          url = "https://chat.deepseek.com/api/v0/share/content?share_id=j0jd7fjxen1tk6g1od"
          req = urllib.request.Request(url, headers={
              "accept": "application/json, text/plain, */*",
              "accept-language": "en-US,en;q=0.9",
              "referer": "https://chat.deepseek.com/",
              "user-agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36",
          })
          data = json.load(urllib.request.urlopen(req, timeout=90))
          msgs = data["data"]["biz_data"]["messages"]
          out = []
          for m in msgs:
              if m.get("content"):
                  out.append(m["content"])
              for f in (m.get("fragments") or []):
                  if f.get("content"):
                      out.append(f["content"])
          open("shared_raw.json", "w", encoding="utf-8").write(json.dumps(data, ensure_ascii=False))
          open("shared.md", "w", encoding="utf-8").write("\n\n".join(out))
          print("messages:", len(msgs), "total chars:", sum(len(x) for x in out))
          EOF
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared.md shared_raw.json
          git commit -m "Fetch shared conversation content" || echo "nothing to commit"
          git push
